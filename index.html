<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>You Are Badass</title>

  <!-- Google Analytics (GA4) loader; config runs from app.js -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-35XL0X1T4C"></script>

  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="stage">
    <section class="card-block">
      <div class="scene">
        <div class="card">
          <img src="card.png" alt="You Are Badass — Don't change a thing. You're perfect just the way you are.">
          <span class="sheen"></span>
          <span class="rim"></span>
        </div>
        <div class="reflection" aria-hidden="true">
          <img src="card.png" alt="">
        </div>
      </div>
      <p class="note">Someone gave you this card because you look awesome and to make your day a little better.</p>
      <p class="note-fine">No catch. No obligation. Just a random act of kindness.</p>
    </section>
  </main>

  <section class="experiences" aria-label="What people are saying">
    <div class="ticker" id="ticker">
      <ul class="ticker-track" id="track"></ul>
    </div>
    <p class="exp-state" id="expState">Loading&hellip;</p>
    <div class="exp-head">
      <button type="button" class="btn" id="openForm">Share your experience</button>
    </div>
  </section>

  <footer>
    <button class="heart-btn" id="heart" aria-pressed="false" aria-label="Like">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 21s-7.5-4.9-10-9.6C.3 8.1 1.8 4.4 5.2 3.9 7.5 3.6 9.4 4.8 12 7.7c2.6-2.9 4.5-4.1 6.8-3.8 3.4.5 4.9 4.2 3.2 7.5C19.5 16.1 12 21 12 21z" />
      </svg>
    </button>
  </footer>

  <dialog class="modal" id="expDialog">
    <form id="expForm" novalidate>
      <h3>Share your experience</h3>

      <label>
        Your experience
        <textarea name="experience" rows="5" maxlength="2000" required
                  placeholder="What happened? How did it feel?"></textarea>
      </label>

      <label class="rating-row">
        Rating
        <span class="stars-input" id="starsInput" role="group" aria-label="Rating, 1 to 5">
          <button type="button" class="star" aria-label="1 star">&#9733;</button>
          <button type="button" class="star" aria-label="2 stars">&#9733;</button>
          <button type="button" class="star" aria-label="3 stars">&#9733;</button>
          <button type="button" class="star" aria-label="4 stars">&#9733;</button>
          <button type="button" class="star" aria-label="5 stars">&#9733;</button>
        </span>
        <input type="hidden" name="rating" id="ratingValue" value="0">
      </label>

      <label>
        Name <span class="opt">(optional)</span>
        <input type="text" name="name" maxlength="80" autocomplete="name">
      </label>

      <label>
        Email <span class="opt">(optional, never shown publicly)</span>
        <input type="email" name="email" maxlength="254" autocomplete="email">
      </label>

      <label class="check">
        <input type="checkbox" name="anonymous">
        Post anonymously
      </label>

      <!-- honeypot: hidden from humans, bots fill it -->
      <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div class="form-actions">
        <button type="button" class="btn ghost" id="cancelForm">Cancel</button>
        <button type="submit" class="btn" id="submitForm">Submit</button>
      </div>
      <p class="form-msg" id="formMsg" role="status" aria-live="polite"></p>
    </form>
  </dialog>
</body>
</html>
