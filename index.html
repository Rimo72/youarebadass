<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You Are Badass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --ink: #f4f4f2;
      --yellow: #f5c518;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Permanent Marker", "Comic Sans MS", cursive;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      overflow-x: hidden;
    }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7vh 8vw;
    }

    .card {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-family: "Anton", "Arial Narrow", "Arial Black", sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      line-height: 0.86;
      letter-spacing: 0.005em;
      font-size: clamp(3.6rem, 15vw, 7.4rem);
      color: #fff;
    }

    .brush {
      width: min(100%, 560px);
      height: clamp(26px, 7vw, 46px);
      margin: clamp(14px, 3vw, 26px) 0 clamp(40px, 9vw, 74px);
      display: block;
      overflow: visible;
    }
    .brush path { fill: var(--yellow); }

    .line-1 {
      color: var(--yellow);
      text-transform: uppercase;
      line-height: 1.15;
      letter-spacing: 0.02em;
      font-size: clamp(1.5rem, 6vw, 2.5rem);
    }

    .line-2 {
      margin-top: clamp(18px, 4vw, 32px);
      text-transform: uppercase;
      line-height: 1.25;
      letter-spacing: 0.02em;
      font-size: clamp(1.15rem, 4.6vw, 1.85rem);
      max-width: 12em;
    }

    footer {
      padding: 10px 8vw 40px;
      display: flex;
      justify-content: flex-end;
    }

    .heart-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: inline-flex;
      padding: 8px;
      line-height: 0;
    }
    .heart-btn svg { width: clamp(34px, 9vw, 46px); height: clamp(34px, 9vw, 46px); overflow: visible; }
    .heart-btn svg path {
      fill: none;
      stroke: var(--yellow);
      stroke-width: 2;
      transition: fill 0.25s ease, transform 0.2s ease;
      transform-origin: center;
    }
    .heart-btn.liked svg path { fill: var(--yellow); }
    .heart-btn:active svg path { transform: scale(0.82); }

    @media (max-width: 600px) {
      .stage { padding: 8vh 8vw 4vh; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="card">
      <h1>You Are<br>Badass</h1>

      <svg class="brush" viewBox="0 0 560 46" preserveAspectRatio="none" aria-hidden="true">
        <path d="M4,26
                 C 130,8 320,6 440,12
                 C 490,14 525,20 556,9
                 C 558,9 559,12 557,15
                 C 525,32 480,35 440,34
                 C 320,32 130,36 16,44
                 C 6,45 1,40 2,33
                 C 2,29 3,27 4,26 Z" />
      </svg>

      <p class="line-1">Don't change a thing.</p>
      <p class="line-2">You're perfect just the way you are.</p>
    </section>
  </main>

  <footer>
    <button class="heart-btn" id="heart" aria-pressed="false" aria-label="Like">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 21s-7.5-4.9-10-9.6C.3 8.1 1.8 4.4 5.2 3.9 7.5 3.6 9.4 4.8 12 7.7c2.6-2.9 4.5-4.1 6.8-3.8 3.4.5 4.9 4.2 3.2 7.5C19.5 16.1 12 21 12 21z" />
      </svg>
    </button>
  </footer>

  <script>
    (function () {
      var btn = document.getElementById('heart');
      var LIKED = 'yab_liked';
      var liked = false;

      try { liked = localStorage.getItem(LIKED) === '1'; } catch (e) {}
      render();

      btn.addEventListener('click', function () {
        liked = !liked;
        try { localStorage.setItem(LIKED, liked ? '1' : '0'); } catch (e) {}
        render();
      });

      function render() {
        btn.classList.toggle('liked', liked);
        btn.setAttribute('aria-pressed', liked ? 'true' : 'false');
      }
    })();
  </script>
</body>
</html>
