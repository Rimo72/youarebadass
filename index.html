<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You Are Badass</title>
  <style>
    :root {
      --bg: #000;
      --ink: #f4f4f2;
      --muted: #8a8a8a;
      --yellow: #f5c518;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      overflow-x: hidden;
    }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8vh 8vw;
    }

    .card-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 460px;
      width: 100%;
    }

    .card {
      width: min(300px, 72vw);
      border-radius: 12px;
      display: block;
      transform: rotate(-4deg);
      box-shadow:
        0 30px 60px -15px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.06);
      transition: transform 0.4s ease;
    }
    .card:hover { transform: rotate(0deg) translateY(-6px); }

    .note {
      margin-top: clamp(40px, 9vw, 66px);
      font-weight: 700;
      font-size: clamp(1rem, 2.6vw, 1.15rem);
      line-height: 1.5;
      max-width: 20em;
    }

    .note-fine {
      margin-top: 0.9rem;
      color: var(--muted);
      font-size: clamp(0.85rem, 2vw, 0.95rem);
      line-height: 1.6;
      max-width: 22em;
    }

    footer {
      padding: 10px 8vw 40px;
      display: flex;
      justify-content: flex-end;
    }

    .heart-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: inline-flex;
      padding: 8px;
      line-height: 0;
    }
    .heart-btn svg { width: clamp(32px, 8vw, 42px); height: clamp(32px, 8vw, 42px); overflow: visible; }
    .heart-btn svg path {
      fill: none;
      stroke: var(--yellow);
      stroke-width: 2;
      transition: fill 0.25s ease, transform 0.2s ease;
      transform-origin: center;
    }
    .heart-btn.liked svg path { fill: var(--yellow); }
    .heart-btn:active svg path { transform: scale(0.82); }

    @media (max-width: 600px) {
      .stage { padding: 8vh 8vw 4vh; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="card-block">
      <img class="card" src="card.png" alt="You Are Badass — Don't change a thing. You're perfect just the way you are.">
      <p class="note">Someone gave you this card to make your day a little better.</p>
      <p class="note-fine">No catch. No obligation. Just a random act of kindness.</p>
    </section>
  </main>

  <footer>
    <button class="heart-btn" id="heart" aria-pressed="false" aria-label="Like">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 21s-7.5-4.9-10-9.6C.3 8.1 1.8 4.4 5.2 3.9 7.5 3.6 9.4 4.8 12 7.7c2.6-2.9 4.5-4.1 6.8-3.8 3.4.5 4.9 4.2 3.2 7.5C19.5 16.1 12 21 12 21z" />
      </svg>
    </button>
  </footer>

  <script>
    (function () {
      var btn = document.getElementById('heart');
      var LIKED = 'yab_liked';
      var liked = false;

      try { liked = localStorage.getItem(LIKED) === '1'; } catch (e) {}
      render();

      btn.addEventListener('click', function () {
        liked = !liked;
        try { localStorage.setItem(LIKED, liked ? '1' : '0'); } catch (e) {}
        render();
      });

      function render() {
        btn.classList.toggle('liked', liked);
        btn.setAttribute('aria-pressed', liked ? 'true' : 'false');
      }
    })();
  </script>
</body>
</html>
