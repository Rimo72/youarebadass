<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You Are Badass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0c;
      --ink: #f7f7f5;
      --muted: #8a8a8a;
      --yellow: #ffcf3f;
      --card: #17171a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      overflow-x: hidden;
    }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6vh 7vw;
    }

    .intro {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-family: "Archivo Black", "Arial Black", Impact, sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      line-height: 0.9;
      letter-spacing: -0.01em;
      font-size: clamp(3.4rem, 9vw, 6.6rem);
    }

    .underline-wrap { position: relative; display: inline-block; }
    .underline-wrap svg {
      position: absolute;
      left: -2%;
      bottom: -0.22em;
      width: 104%;
      height: 0.35em;
      overflow: visible;
    }
    .underline-wrap svg path {
      fill: none;
      stroke: var(--yellow);
      stroke-width: 14;
      stroke-linecap: round;
    }

    .lead {
      margin-top: 2.2rem;
      font-weight: 700;
      font-size: clamp(1rem, 1.5vw, 1.15rem);
      line-height: 1.5;
      max-width: 22em;
    }

    .fine {
      margin-top: 1.1rem;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      max-width: 24em;
    }

    /* ---------- Footer heart ---------- */
    footer {
      padding: 22px 7vw 30px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .heart-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      padding: 6px;
    }
    .heart-btn svg { width: 22px; height: 22px; overflow: visible; }
    .heart-btn svg path {
      fill: none;
      stroke: var(--yellow);
      stroke-width: 2;
      transition: fill 0.25s ease, transform 0.25s ease;
      transform-origin: center;
    }
    .heart-btn.liked { color: var(--yellow); }
    .heart-btn.liked svg path { fill: var(--yellow); }
    .heart-btn:active svg path { transform: scale(0.8); }

    /* ---------- Responsive ---------- */
    @media (max-width: 820px) {
      .stage { padding: 8vh 8vw 4vh; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="intro">
      <h1>You Are<br>
        <span class="underline-wrap">Badass<svg viewBox="0 0 300 30" preserveAspectRatio="none" aria-hidden="true">
          <path d="M4 20 C 60 8, 120 8, 160 14 S 250 24, 296 10" />
        </svg></span>
      </h1>
      <p class="lead">Someone gave you this card to make your day a little better.</p>
      <p class="fine">No catch. No obligation. Just a random act of kindness.</p>
    </section>
  </main>

  <footer>
    <button class="heart-btn" id="heart" aria-pressed="false" aria-label="Like">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 21s-7.5-4.9-10-9.6C.3 8.1 1.8 4.4 5.2 3.9 7.5 3.6 9.4 4.8 12 7.7c2.6-2.9 4.5-4.1 6.8-3.8 3.4.5 4.9 4.2 3.2 7.5C19.5 16.1 12 21 12 21z" />
      </svg>
    </button>
  </footer>

  <script>
    (function () {
      var btn = document.getElementById('heart');
      var LIKED = 'yab_liked';
      var liked = false;

      try {
        liked = localStorage.getItem(LIKED) === '1';
      } catch (e) {}

      render();

      btn.addEventListener('click', function () {
        liked = !liked;
        try {
          localStorage.setItem(LIKED, liked ? '1' : '0');
        } catch (e) {}
        render();
      });

      function render() {
        btn.classList.toggle('liked', liked);
        btn.setAttribute('aria-pressed', liked ? 'true' : 'false');
      }
    })();
  </script>
</body>
</html>
