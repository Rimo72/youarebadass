<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Experiences · You Are Badass</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/supabase.min.js" defer></script>
  <script src="admin.js" defer></script>
</head>
<body class="admin">
  <main class="admin-wrap">
    <h1>Experiences</h1>

    <section id="login" hidden>
      <p class="admin-lead">Sign in.</p>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="email" autocomplete="username" required>
        <input type="password" id="loginPassword" placeholder="password" autocomplete="current-password" required>
        <button type="submit" class="btn" id="loginBtn">Sign in</button>
      </form>

      <p class="admin-alt">
        <button type="button" class="linkish" id="useCode">Email me a one-time code instead</button>
      </p>

      <form id="codeForm" hidden>
        <input type="email" id="codeEmail" placeholder="email" autocomplete="email" required>
        <button type="submit" class="btn" id="codeSendBtn">Send code</button>
      </form>
      <form id="codeVerifyForm" hidden>
        <input type="text" id="loginCode" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]*" maxlength="6" placeholder="123456" required>
        <button type="submit" class="btn" id="codeBtn">Verify</button>
        <button type="button" class="btn ghost" id="codeBack">Back</button>
      </form>

      <p class="form-msg" id="loginMsg" role="status" aria-live="polite"></p>
    </section>

    <section id="panel" hidden>
      <div class="admin-bar">
        <span id="whoami" class="admin-who"></span>
        <button type="button" class="btn ghost" id="signOut">Sign out</button>
      </div>

      <p class="exp-state" id="listState">Loading&hellip;</p>
      <div class="table-scroll">
        <table class="admin-table" hidden id="table">
          <thead>
            <tr>
              <th>Date</th>
              <th>From</th>
              <th>Rating</th>
              <th>Status</th>
              <th>Experience</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="list"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
